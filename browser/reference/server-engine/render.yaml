services:
  - type: web
    name: msk-video-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    numInstances: 1
    healthCheckPath: /api/ready
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: MSK_DATA_DIR
        value: /app/storage
      - key: ALLOWED_ORIGINS
        value: https://saikiran1madasu.github.io
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: MAX_DURATION_SECONDS
        value: "600"
      - key: MAX_VIDEO_PIXELS
        value: "2073600"
      - key: JOB_TIMEOUT_SECONDS
        value: "1200"
      - key: OUTPUT_RETENTION_HOURS
        value: "24"
    disk:
      name: video-storage
      mountPath: /app/storage
      sizeGB: 10
